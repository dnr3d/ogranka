<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Огранка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap">
<style>
/* Layout: one phone screen built around the hand-drawn board. Level, moves and tools sit beside the
   clip, goals sit on the pink bar. --k converts board.png pixels into CSS pixels. */
:root {
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: #fdf3f4;
  --paper: #fdf3f4;
  --ink: #1c0a10;
  --pink: #ddb8c0;
  --pink-deep: #a84f6c;
  --muted: #6d5a61;
  --font: "Balsamiq Sans", "Comic Sans MS", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 14px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#tray {
  --k: .3; position: relative; flex: none;
  width: calc(1080px * var(--k)); height: calc(1350px * var(--k));
  background: url("assets/board.png") no-repeat 0 calc(-50px * var(--k)) / calc(1080px * var(--k)) auto;
}
#top {
  position: absolute; top: 0; left: 15%; right: 0; height: calc(190px * var(--k));
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
#levelLabel { font-weight: 700; font-size: 15px; line-height: 1.1; white-space: nowrap; }
#movesBox { display: flex; flex-direction: column; align-items: center; line-height: 1; }
#moves { font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
#moves.low { color: var(--pink-deep); }
.label { font-size: 11px; letter-spacing: .04em; color: var(--muted); }
#tools { display: flex; gap: 4px; }
.icon {
  width: 44px; height: 44px; display: grid; place-items: center; padding: 0;
  background: transparent; color: var(--ink); border: 2px solid var(--ink); border-radius: 50%; cursor: pointer;
}
.icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon:focus-visible, .cta:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 2px; }
.icon[aria-pressed="false"] .wave { display: none; }

#goals {
  position: absolute; top: calc(190px * var(--k)); left: calc(70px * var(--k)); right: calc(22px * var(--k)); height: calc(125px * var(--k));
  display: flex; align-items: center; justify-content: center; gap: 12px;
}
.goal { display: flex; align-items: center; gap: 4px; }
.goal b { font-weight: 700; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2ch; }
.goal.done b { color: var(--pink-deep); }
.goal.pop { animation: pop .22s ease-out; }
@keyframes pop { 50% { transform: scale(1.18); } }
.pic { display: block; flex: none; object-fit: contain; }

#board {
  position: absolute; display: block;
  left: calc(47px * var(--k)); top: calc(331px * var(--k));
  touch-action: none; cursor: pointer;
}

#scoreRow { display: flex; align-items: center; gap: 8px; }
#score { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 4ch; }
#bar { position: relative; flex: 1; height: 10px; border-radius: 5px; background: #fff; box-shadow: inset 0 0 0 2px var(--ink); overflow: hidden; }
#fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--pink-deep); transition: width .3s ease-out; }
.tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }

#legend { display: flex; justify-content: space-between; gap: 6px; }
.leg { flex: 1; display: flex; align-items: center; gap: 3px; font-size: 12px; line-height: 1.15; color: var(--muted); min-width: 0; }
.leg canvas { flex: none; }

.flyer { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5; }

#result { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(28, 10, 16, .45); }
#card {
  width: min(340px, 100%); padding: 24px 20px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 6px;
}
#card h2 { margin: 0; font-weight: 700; font-size: 24px; line-height: 1.2; text-wrap: balance; }
#card p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.4; }
#stars { display: flex; gap: 4px; }
#stars svg { width: 60px; height: 60px; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
#left { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.cta {
  width: 100%; min-height: 50px; border: 3px solid var(--ink); border-radius: 6px; cursor: pointer;
  background: var(--pink); color: var(--ink); font: 700 17px/1 var(--font);
}
.cta.ghost { background: transparent; }
.cta:disabled { opacity: .45; cursor: default; }

/* ---------- Meta screens: hub, run map, prep, scenes ---------- */
#shell { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.screen.enter { animation: enter .26s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } }
.padded {
  padding-block: 12px; gap: 12px; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.bar {
  flex: none; display: flex; align-items: center; gap: 8px; min-height: 60px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 3px solid var(--ink); background: var(--pink);
}
.bar .grow { flex: 1; min-width: 0; }
.bar h1 { margin: 0; font-size: 18px; line-height: 1.1; }
.bar .sub { font-size: 12px; color: #4f3a42; }
.bar .icon { background: var(--paper); }
.coins { display: flex; align-items: center; gap: 4px; padding: 4px 10px 4px 6px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; font-weight: 700; font-variant-numeric: tabular-nums; }
.coin { width: 18px; height: 18px; border-radius: 50%; background: #ffd34d; border: 2px solid var(--ink); flex: none; }
.hearts { display: flex; gap: 2px; align-items: center; }
.heart { width: 20px; height: 20px; fill: #e8799a; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.heart.off { fill: #f1e4e7; }
.heart.small { width: 14px; height: 14px; stroke-width: 2.4; }

/* Placeholder art: anything hatched is waiting for a drawing. */
.stub {
  display: grid; place-items: center; text-align: center; padding: 4px; color: var(--muted); font-size: 11px; line-height: 1.1;
  border: 2px dashed var(--ink); border-radius: 8px;
  background: repeating-linear-gradient(45deg, #fff 0 8px, #efe3e7 8px 16px);
}
.avatar { width: 48px; height: 48px; border-radius: 50%; flex: none; font-size: 20px; font-weight: 700; color: var(--ink); padding: 0; }

#hubView { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
#tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 3px solid var(--ink); background: var(--paper); }
.tab { min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: 0; color: var(--muted); font: 400 12px/1 var(--font); cursor: pointer; }
.tab[aria-current="page"] { background: var(--pink); color: var(--ink); font-weight: 700; }
.tab:focus-visible, .loc:focus-visible, .node:focus-visible, .row:focus-visible, .boost:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: -3px; }

.campus { position: relative; flex: 1; min-height: 340px; background: #dfe7ed; overflow: hidden; }
.campus svg.paths { position: absolute; inset: 0; width: 100%; height: 100%; }
.loc { position: absolute; width: 29%; transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 3px; padding: 0; background: none; border: 0; color: var(--ink); font: 700 13px/1.1 var(--font); cursor: pointer; }
.loc .stub { width: 100%; height: clamp(44px, 10vh, 96px); }
.loc.main { width: 42%; }
.loc.main .stub { height: clamp(56px, 13vh, 120px); }
.loc .name { align-self: center; padding: 3px 8px; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; white-space: nowrap; }
.people { position: absolute; top: -8px; right: -6px; display: flex; }
.dot { width: 24px; height: 24px; margin-left: -6px; display: grid; place-items: center; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); font-size: 12px; font-weight: 700; }
.ctaWrap { flex: none; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }

.row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; text-align: left; background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; font: 400 14px/1.25 var(--font); }
button.row { cursor: pointer; }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row b { font-size: 16px; }
.row small { font-size: 12px; color: var(--muted); }
.note { margin: 0; font-size: 13px; line-height: 1.35; color: var(--muted); }
.title2 { margin: 0; font-size: 22px; line-height: 1.15; text-wrap: balance; }

#track { position: relative; flex: 1; min-height: 0; overflow-y: auto; background: #dfe7ed; }
#trackIn { position: relative; }
#trackIn > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; width: 84px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; background: none; border: 0; color: var(--ink); font: 700 12px/1.1 var(--font); }
.node .disc { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
.node .cap { padding: 2px 5px; background: var(--paper); border-radius: 4px; }
.node.open { cursor: pointer; }
.node.open .disc { background: var(--pink); animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: scale(1.1); } }
.node.locked { color: #5d6b78; }
.node.locked .disc { background: #cdd7df; border-color: #5d6b78; }
.node.done .disc { background: var(--ink); color: var(--paper); }
.node.boss .disc { width: 72px; height: 72px; background: #ffd34d; }
.node.boss.locked .disc { background: #e8dca9; border-color: var(--ink); }

.goalsRow { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.boosts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.boost { display: flex; flex-direction: column; gap: 4px; padding: 10px; min-height: 104px; text-align: left; background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; font: 400 12px/1.25 var(--font); cursor: pointer; }
.boost b { font-size: 15px; }
.boost .price { margin-top: auto; display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; }
.boost[aria-pressed="true"] { background: var(--pink); border-width: 3px; padding: 9px; }
.boost:disabled { opacity: .45; cursor: default; }
.foot { flex: none; margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.roomArt { flex: none; height: 110px; }
#prep .foot { flex-direction: row-reverse; }
#prep .foot .cta { flex: 1; min-width: 0; font-size: 15px; line-height: 1.1; }
@media (max-height: 640px) { .roomArt { display: none; } }
.sceneArt { width: 100%; flex: 1 1 140px; min-height: 120px; max-height: 300px; font-size: 13px; }

#sheetWrap { position: fixed; inset: 0; z-index: 8; display: flex; align-items: flex-end; justify-content: center; background: rgba(28, 10, 16, .45); }
#sheet {
  width: 100%; max-width: 520px; max-height: 85%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  padding-block: 18px max(18px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paper); border-top: 3px solid var(--ink); border-radius: 14px 14px 0 0;
  animation: rise .2s ease-out;
}
@keyframes rise { from { transform: translateY(40px); opacity: .4; } }
.portrait { width: 100%; height: 170px; font-size: 13px; }
.line { margin: 0; padding: 10px 12px; background: #fff; border: 2px solid var(--ink); border-radius: 8px; font-size: 16px; line-height: 1.35; }
.speaker { font-weight: 700; display: block; margin-bottom: 2px; color: var(--pink-deep); font-size: 14px; }

#wipe { position: fixed; inset: 0; z-index: 12; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; text-align: center; background: var(--pink); animation: wipe .9s ease-in-out both; }
#wipeTitle { font-size: 30px; font-weight: 700; }
#wipeSub { font-size: 16px; }
@keyframes wipe { 0% { transform: translateY(100%); } 28%, 72% { transform: none; } 100% { transform: translateY(-100%); } }
#toast { position: fixed; left: 50%; bottom: 84px; z-index: 13; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 9px 14px; background: var(--ink); color: var(--paper); border-radius: 8px; font-size: 14px; }
.title3 { margin: 4px 0 0; font-size: 17px; }
.tab { position: relative; }
.ping { position: absolute; top: 8px; right: calc(50% - 22px); width: 10px; height: 10px; border-radius: 50%; background: var(--pink-deep); border: 2px solid var(--ink); }
small.new { color: var(--pink-deep); font-weight: 700; }
.calendar { flex: none; display: flex; gap: 6px; margin: 0; list-style: none; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--paper); border-bottom: 2px solid var(--ink); }
.calendar li { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 4px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; }
.calendar small { font-size: 11px; color: var(--muted); }
.calendar li.now { background: var(--pink); }
.calendar li.now small { color: var(--ink); }
.calendar li.past { opacity: .45; }
.node .initial { font-size: 24px; }
.node.done .initial { color: inherit; }
.node .cap { display: flex; flex-direction: column; align-items: center; }
.node .cap small { font-weight: 400; font-size: 11px; }
.goalsRow { flex-wrap: wrap; gap: 14px; }
.goalsRow small { color: var(--muted); }
.goalsRow b { font-size: 16px; }
.grow2 { margin-left: auto; }
.row.plain { border: 0; background: none; padding: 0; }

#miniStatBox { display: flex; flex-direction: column; align-items: center; line-height: 1; min-width: 48px; }
#miniStat { font-size: 24px; font-variant-numeric: tabular-nums; }
#miniStage { flex: 1; min-height: 0; position: relative; margin: 8px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
#miniCanvas { position: absolute; inset: 0; touch-action: none; display: block; }
#miniControls { flex: none; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.padBtn { min-height: 56px; font: 700 24px/1 var(--font); color: var(--ink); background: var(--pink); border: 3px solid var(--ink); border-radius: 8px; cursor: pointer; touch-action: manipulation; }

.battleBody { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.bossBox { display: flex; gap: 10px; align-items: stretch; flex: none; }
.bossArt { width: 96px; min-height: 96px; flex: none; }
.bossInfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.meter { position: relative; height: 22px; background: #fff; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; transition: width .2s ease-out; }
.meter.boss i { background: #a4b4c6; }
.meter.mine i { background: #e8799a; }
.meter span { position: relative; display: block; text-align: center; font-size: 13px; font-weight: 700; line-height: 18px; font-variant-numeric: tabular-nums; }
.intent { font-size: 13px; line-height: 1.2; padding: 4px 6px; background: #ffd34d; border: 2px solid var(--ink); border-radius: 6px; }
.log { margin: 0; flex: none; min-height: 34px; font-size: 13px; line-height: 1.3; color: var(--muted); }
.me { flex: none; display: flex; flex-direction: column; gap: 4px; }
.piles { display: flex; align-items: center; gap: 6px; }
.energy { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #ffd34d; border: 2px solid var(--ink); font-weight: 700; font-size: 16px; }
.hand, .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.hand { flex: 1; align-content: start; overflow-y: auto; min-height: 96px; }
.card { position: relative; display: flex; flex-direction: column; gap: 3px; min-height: 96px; padding: 28px 7px 7px; text-align: left; background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; font: 400 12px/1.2 var(--font); }
button.card { cursor: pointer; }
button.card:disabled { opacity: .45; cursor: default; }
.card b { font-size: 14px; line-height: 1.1; overflow-wrap: anywhere; }
.card small { font-size: 12px; color: var(--muted); }
.cost { position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: #ffd34d; border: 2px solid var(--ink); font-weight: 700; font-size: 12px; }

#adminBtn { position: fixed; right: 0; top: 40%; z-index: 20; padding: 8px 5px; min-height: 44px; writing-mode: vertical-rl; background: var(--ink); color: var(--paper); border: 0; border-radius: 6px 0 0 6px; font: 400 12px/1 var(--font); cursor: pointer; opacity: .75; }
#admin { position: fixed; inset: 0; z-index: 21; display: flex; justify-content: flex-end; background: rgba(28, 10, 16, .35); }
#adminPanel { width: min(340px, 100%); height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #fff; border-left: 3px solid var(--ink); }
#adminBody { display: flex; flex-direction: column; gap: 8px; }
.adminHead { display: flex; align-items: center; justify-content: space-between; font-size: 18px; }
.adminGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.adm { min-height: 44px; padding: 6px; font: 400 13px/1.15 var(--font); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; cursor: pointer; }
.adm:disabled { opacity: .4; cursor: default; }
.adminCheck { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) {
  .screen.enter, .node.open .disc, #sheet { animation: none; }
  #wipe { animation: wipeFade .5s linear both; }
  @keyframes wipeFade { 0%, 100% { opacity: 0; } 30%, 70% { opacity: 1; } }
}
</style>

<div id="shell">
<section class="screen" id="hub">
  <header class="bar" id="hubBar"></header>
  <div id="hubView"></div>
  <nav id="tabs" aria-label="Разделы"></nav>
</section>
<section class="screen" id="runMap" hidden>
  <header class="bar" id="runBar"></header>
  <div id="track"></div>
</section>
<section class="screen" id="prep" hidden></section>
<section class="screen" id="reward" hidden></section>
<section class="screen" id="battle" hidden></section>
<section class="screen" id="mini" hidden>
  <header class="bar"><div class="grow"><h1 id="miniTitle"></h1><div class="sub" id="miniGoal"></div></div>
    <div id="miniStatBox"><b id="miniStat"></b><span class="label" id="miniStatLabel"></span></div>
    <button class="icon" id="miniExit" aria-label="Сдаться и выйти из кабинета"><svg viewBox="0 0 24 24"><path d="M6 21V4M6 4h12l-3 4 3 4H6"/></svg></button></header>
  <div id="miniStage"><canvas id="miniCanvas" aria-label="Игровое поле"></canvas></div>
  <div id="miniControls"></div>
</section>
<section class="screen" id="scene" hidden></section>
<section class="screen" id="runEnd" hidden></section>
<div class="screen" id="app" hidden>
  <main id="stage">
    <div id="tray">
      <header id="top">
        <span id="levelLabel">Уровень 1</span>
        <div id="movesBox"><span id="moves">20</span><span class="label">ходы</span></div>
        <div id="tools">
          <button class="icon" id="btnSound" aria-label="Звук" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
          <button class="icon" id="btnExit" aria-label="Сдаться и выйти из кабинета"><svg viewBox="0 0 24 24"><path d="M6 21V4M6 4h12l-3 4 3 4H6"/></svg></button>
        </div>
      </header>
      <div id="goals" aria-label="Цели уровня"></div>
      <canvas id="board" aria-label="Игровое поле 7 на 7"></canvas>
    </div>
  </main>
  <div id="scoreRow"><span class="label">Очки</span><span id="score">0</span><div id="bar"><div id="fill"></div><i class="tick" id="tick2"></i></div></div>
  <footer id="legend"></footer>
