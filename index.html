<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Огранка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one phone screen, a jeweller's tray. HUD on top, the board fills what is left, legend below. */
:root {
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: #190c10;
  --velvet: #241318;
  --velvet-deep: #190c10;
  --cell-a: #35202a;
  --cell-b: #2c1921;
  --brass: #d9ae62;
  --brass-dim: #7d6038;
  --paper: #f5e8d3;
  --muted: #bda493;
  --warn: #ff9271;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; overscroll-behavior: none;
  background: radial-gradient(120% 80% at 50% 45%, var(--velvet) 0%, var(--velvet-deep) 100%), var(--velvet-deep);
  color: var(--paper); font-family: var(--font-body); font-size: 14px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

#top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
#lvl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
#levelLabel { font: 700 14px/1.2 var(--font-display); white-space: nowrap; }
#movesBox { display: flex; flex-direction: column; align-items: center; min-width: 76px; }
#moves { font: 700 34px/1 var(--font-display); color: var(--brass); font-variant-numeric: tabular-nums; }
#moves.low { color: var(--warn); }
#tools { display: flex; justify-content: flex-end; gap: 6px; }
.icon {
  width: 44px; height: 44px; display: grid; place-items: center; padding: 0;
  background: transparent; color: var(--muted); border: 1px solid var(--brass-dim); border-radius: 50%; cursor: pointer;
}
.icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon:focus-visible, .cta:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.icon[aria-pressed="false"] .wave { display: none; }

#goals { display: flex; justify-content: center; gap: 8px; min-height: 44px; }
.goal {
  display: flex; align-items: center; gap: 4px; padding: 3px 12px 3px 5px;
  border: 1px solid var(--brass-dim); border-radius: 999px; background: var(--velvet-deep);
}
.goal b { font: 700 15px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.goal.done { border-color: var(--brass); }
.goal.done b { color: var(--brass); }
.goal.pop { animation: pop .22s ease-out; }
@keyframes pop { 50% { transform: scale(1.14); } }
.sprite { background-image: url("assets/gems.png"); background-repeat: no-repeat; flex: none; }
.sprite.off { filter: grayscale(1) brightness(.45); }

#scoreRow { display: flex; align-items: center; gap: 10px; }
#score { font: 500 13px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 4ch; }
#bar { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--velvet-deep); box-shadow: inset 0 0 0 1px var(--brass-dim); }
#fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--brass); transition: width .3s ease-out; }
.tick { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--paper); opacity: .75; }

#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#board { display: block; border-radius: 10px; box-shadow: 0 0 0 1px var(--brass-dim), 0 0 0 5px var(--velvet-deep), 0 0 0 6px var(--brass-dim); touch-action: none; cursor: pointer; }

#legend { display: flex; justify-content: space-between; gap: 6px; padding-top: 4px; }
.leg { flex: 1; display: flex; align-items: center; gap: 2px; font-size: 11px; line-height: 1.2; color: var(--muted); min-width: 0; }

.flyer { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5; }

#result { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(25, 12, 16, .78); }
#card {
  width: min(340px, 100%); padding: 24px 20px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center;
  background: var(--velvet); border: 1px solid var(--brass); border-radius: 16px;
}
#card h2 { margin: 0; font: 700 22px/1.2 var(--font-display); text-wrap: balance; }
#card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
#stars { display: flex; gap: 4px; }
#left { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.cta {
  width: 100%; min-height: 50px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--brass); color: var(--velvet-deep); font: 700 14px/1 var(--font-display);
}
</style>

<div id="app">
  <header id="top">
    <div id="lvl"><span class="eyebrow">Огранка</span><span id="levelLabel">Уровень 1</span></div>
    <div id="movesBox"><span id="moves">20</span><span class="eyebrow">ходы</span></div>
    <div id="tools">
      <button class="icon" id="btnSound" aria-label="Звук" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
      <button class="icon" id="btnRestart" aria-label="Начать уровень заново"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1"/><path d="M5 4v4h4"/></svg></button>
    </div>
  </header>
  <div id="goals" aria-label="Цели уровня"></div>
  <div id="scoreRow"><span class="eyebrow">Караты</span><span id="score">0</span><div id="bar"><div id="fill"></div><i class="tick" id="tick2"></i></div></div>
  <main id="stage"><canvas id="board" aria-label="Игровое поле 8 на 8"></canvas></main>
  <footer id="legend"></footer>
</div>
<div id="result" hidden>
  <div id="card" role="dialog" aria-modal="true" aria-labelledby="resTitle">
    <h2 id="resTitle"></h2>
    <div id="stars"></div>
    <div id="left"></div>
    <p id="resText"></p>
    <button class="cta" id="resBtn"></button>
  </div>
</div>

<script>
'use strict';
/* ---------- Data ---------- */
const SIZE = 8, FRAMES = 40, TILE = 52, STAR_ROW = 21;
// Sheet rows: each color takes 3 rows in order gem, heart (bomb), arc (line).
const COLORS = [
  { name: 'Рубины',   row: 12, hex: '#ff5a3c' },
  { name: 'Сапфиры',  row: 0,  hex: '#5a97ff' },
  { name: 'Изумруды', row: 3,  hex: '#35de5c' },
  { name: 'Цитрины',  row: 18, hex: '#ecdc30' },
  { name: 'Аметисты', row: 9,  hex: '#bd4cf5' },
  { name: 'Алмазы',   row: 15, hex: '#dff2fb' },
];
const KIND_OFFSET = { gem: 0, bomb: 1, line: 2 };
const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319];

function levelConfig(n) {
  const nColors = n <= 3 ? 5 : 6;
  const kinds = n === 1 ? 1 : n <= 3 ? 2 : 3;
  const perGoal = Math.min(26, 10 + n * 2);
  const moves = Math.min(24, 8 + kinds * 4 + Math.floor(n / 4));
  const goals = {};
  for (let i = 0; i < kinds; i++) goals[(n - 1 + i * 2) % nColors] = perGoal;
  return { nColors, goals, moves, star2: moves * 85, star3: moves * 125 };
}

/* ---------- State ---------- */
const $ = id => document.getElementById(id);
const canvas = $('board'), ctx = canvas.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sheet = new Image(); sheet.src = 'assets/gems.png';
let SPEED = reduced ? .4 : 1;
let grid = [], S = {}, busy = false, restartPending = false, nextId = 1;
let cell = 40, dpr = 1, now = performance.now();
let selected = null, hint = null, hintAt = 0, waveStart = 0, shake = 0;
const tweens = new Set();
let particles = [], fxList = [], popups = [];

const key = (r, c) => r * SIZE + c;
const unkey = k => [Math.floor(k / SIZE), k % SIZE];
const rnd = n => Math.floor(Math.random() * n);
const inBoard = (r, c) => r >= 0 && c >= 0 && r < SIZE && c < SIZE;
const gemAt = k => { const [r, c] = unkey(k); return grid[r][c]; };

function newGem(r, c, color, kind = 'gem') {
  return { id: nextId++, color, kind, x: c, y: r, sc: 1, a: 1, spent: false };
}

/* ---------- Tweens ---------- */
function tween(ms, fn, ease = t => t, delay = 0) {
  if (SPEED === 0) { fn(1); return Promise.resolve(); }
  return new Promise(res => tweens.add({ t0: now + delay * SPEED, ms: ms * SPEED, fn, ease, res }));
}
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeIO = t => t < .5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
const landing = t => { // falls, then a small rebound
  if (t < .8) return easeIn(t / .8);
  const u = (t - .8) / .2;
  return 1 - .05 * Math.sin(u * Math.PI);
};

/* ---------- Match logic ---------- */
function colorAt(g, r, c) { const x = g[r][c]; return x && x.kind !== 'star' ? x.color : -1; }

function findGroups(g) {
  const runs = [];
  for (let axis = 0; axis < 2; axis++) {
    for (let a = 0; a < SIZE; a++) {
      let b = 0;
      while (b < SIZE) {
        const at = i => axis ? colorAt(g, i, a) : colorAt(g, a, i);
        const col = at(b);
        if (col < 0) { b++; continue; }
        let e = b + 1;
        while (e < SIZE && at(e) === col) e++;
        if (e - b >= 3) {
          const cells = [];
          for (let i = b; i < e; i++) cells.push(axis ? key(i, a) : key(a, i));
          runs.push({ axis, color: col, cells });
        }
        b = e;
      }
    }
  }
  const groups = [];
  for (const run of runs) {
    const overlaps = groups.filter(gr => run.cells.some(k => gr.cells.has(k)));
    const merged = { color: run.color, cells: new Set(run.cells), runs: [run] };
    for (const o of overlaps) {
      o.cells.forEach(k => merged.cells.add(k));
      merged.runs.push(...o.runs);
      groups.splice(groups.indexOf(o), 1);
    }
    groups.push(merged);
  }
  return groups;
}

function specialFor(group) {
  const longest = Math.max(...group.runs.map(r => r.cells.length));
  if (longest >= 5) return 'star';
  if (new Set(group.runs.map(r => r.axis)).size > 1) return 'bomb';
  if (longest === 4) return 'line';
  return null;
}

function spawnCell(group, swapKeys) {
  for (const k of swapKeys || []) if (group.cells.has(k)) return k;
  if (group.runs.length > 1) {
    const [a, b] = group.runs;
    const cross = a.cells.find(k => b.cells.includes(k));
    if (cross !== undefined) return cross;
  }
  const run = group.runs.reduce((m, r) => r.cells.length > m.cells.length ? r : m);
  return run.cells[Math.floor(run.cells.length / 2)];
}

function swapGrid(a, b) { const t = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t; }

function findMove() {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (!inBoard(r2, c2)) continue;
      const a = { r, c }, b = { r: r2, c: c2 }, ga = grid[r][c], gb = grid[r2][c2];
      if (isCombo(ga, gb)) return [a, b];
      swapGrid(a, b);
      const ok = findGroups(grid).length > 0;
      swapGrid(a, b);
      if (ok) return [a, b];
    }
  }
  return null;
}
const isCombo = (a, b) => a.kind === 'star' || b.kind === 'star' || (a.kind !== 'gem' && b.kind !== 'gem');

function mostCommonColor() {
  const n = new Array(COLORS.length).fill(0);
  for (const row of grid) for (const g of row) if (g && g.color >= 0) n[g.color]++;
  return n.indexOf(Math.max(...n));
}
function cellsOfColor(color) {
  const out = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c] && grid[r][c].color === color) out.push(key(r, c));
  return out;
}
function rowsCols(r, c, radius) {
  const out = [];
  for (let i = 0; i < SIZE; i++) for (let d = -radius; d <= radius; d++) {
    if (inBoard(r + d, i)) out.push(key(r + d, i));
    if (inBoard(i, c + d)) out.push(key(i, c + d));
  }
  return out;
}
function square(r, c, radius, trimCorners) {
  const out = [];
  for (let dr = -radius; dr <= radius; dr++) for (let dc = -radius; dc <= radius; dc++) {
    if (trimCorners && Math.abs(dr) === radius && Math.abs(dc) === radius) continue;
    if (inBoard(r + dr, c + dc)) out.push(key(r + dr, c + dc));
  }
  return out;
}

// What a special gem destroys when it goes off, plus its visual effect.
function fire(g, r, c, delay) {
  if (g.kind === 'line') {
    addFx({ type: 'beam', r, c, width: 1 }, delay);
    return rowsCols(r, c, 0);
  }
  if (g.kind === 'bomb') {
    addFx({ type: 'ring', r, c, radius: 2.6 }, delay);
    return square(r, c, 2, true);
  }
  const targets = cellsOfColor(g.target !== undefined ? g.target : mostCommonColor());
  addFx({ type: 'zap', r, c, targets }, delay);
  return targets;
}

function expand(seeds, protect) {
  const out = new Map();
  const q = [...seeds.entries()];
  while (q.length) {
    const [k, delay] = q.shift();
    if (out.has(k) || protect.has(k)) continue;
    const g = gemAt(k);
    if (!g) continue;
    out.set(k, delay);
    if (g.kind !== 'gem' && !g.spent) queueFire(g, k, delay, q);
  }
  return out;
}
function queueFire(g, k, delay, q) {
  const [r, c] = unkey(k);
  shake = Math.max(shake, g.kind === 'line' ? 4 : 8);
  sound.boom();
  for (const t of fire(g, r, c, delay)) {
    const [r2, c2] = unkey(t);
    q.push([t, delay + (Math.abs(r2 - r) + Math.abs(c2 - c)) * 28]);
  }
}

// Swapping two specials, or a star with anything, fires without needing a match.
function comboSeeds(a, b) {
  const ga = grid[a.r][a.c], gb = grid[b.r][b.c];
  const seeds = new Map();
  const add = (keys, from) => keys.forEach(k => {
    const [r, c] = unkey(k);
    const d = (Math.abs(r - from.r) + Math.abs(c - from.c)) * 28;
    if (!seeds.has(k)) seeds.set(k, d);
  });
  shake = 10; sound.boom();
  if (ga.kind === 'star' && gb.kind === 'star') {
    ga.spent = gb.spent = true;
    addFx({ type: 'ring', r: b.r, c: b.c, radius: 11 }, 0);
    add(square(b.r, b.c, SIZE, false), b);
    return seeds;
  }
  if (ga.kind === 'star' || gb.kind === 'star') {
    const [sp, op] = ga.kind === 'star' ? [a, b] : [b, a];
    const star = grid[sp.r][sp.c], other = grid[op.r][op.c];
    star.spent = true;
    const targets = cellsOfColor(other.color);
    if (other.kind !== 'gem') {
      for (const k of targets) { const g = gemAt(k); if (g.kind === 'gem') g.kind = other.kind; }
    }
    addFx({ type: 'zap', r: sp.r, c: sp.c, targets }, 0);
    add([...targets, key(sp.r, sp.c)], sp);
    return seeds;
  }
  ga.spent = gb.spent = true;
  if (ga.kind === 'bomb' && gb.kind === 'bomb') {
    addFx({ type: 'ring', r: b.r, c: b.c, radius: 4.4 }, 0);
    add(square(b.r, b.c, 3, false), b);
  } else if (ga.kind === 'line' && gb.kind === 'line') {
    addFx({ type: 'beam', r: a.r, c: a.c, width: 1 }, 0);
    addFx({ type: 'beam', r: b.r, c: b.c, width: 1 }, 0);
    add([...rowsCols(a.r, a.c, 0), ...rowsCols(b.r, b.c, 0)], b);
  } else {
    addFx({ type: 'beam', r: b.r, c: b.c, width: 3 }, 0);
    add(rowsCols(b.r, b.c, 1), b);
  }
  return seeds;
}

/* ---------- Turn flow ---------- */
function animateSwap(a, b) {
  const ga = grid[a.r][a.c], gb = grid[b.r][b.c];
  return tween(150, t => {
    ga.x = a.c + (b.c - a.c) * t; ga.y = a.r + (b.r - a.r) * t;
    gb.x = b.c + (a.c - b.c) * t; gb.y = b.r + (a.r - b.r) * t;
  }, easeIO);
}

async function playTurn(a, b) {
  if (busy || S.over) return false;
  busy = true; selected = null; hint = null;
  sound.swap();
  const ga = grid[a.r][a.c], gb = grid[b.r][b.c];
  await animateSwap(a, b);
  swapGrid(a, b);
  let seeds = null;
  if (isCombo(ga, gb)) seeds = comboSeeds(a, b);
  else if (!findGroups(grid).length) {
    sound.bad();
    await animateSwap(a, b);
    swapGrid(a, b);
    idle();
    return false;
  }
  S.moves--;
  renderHud();
  await resolve([key(a.r, a.c), key(b.r, b.c)], seeds);
  await finishTurn();
  return true;
}

async function resolve(swapKeys, firstSeeds) {
  let combo = 0, pending = firstSeeds;
  while (true) {
    const groups = findGroups(grid);
    if (!groups.length && !pending) break;
    combo++;
    const seeds = new Map(pending || []);
    pending = null;
    const protect = new Map();
    const extraQ = [];
    let bonus = 0;
    for (const gr of groups) {
      const kind = specialFor(gr);
      let spawn = null;
      if (kind) {
        spawn = spawnCell(gr, swapKeys);
        protect.set(spawn, { kind, color: gr.color });
        bonus += kind === 'line' ? 40 : kind === 'bomb' ? 80 : 150;
        const here = gemAt(spawn);
        if (here.kind !== 'gem' && !here.spent) queueFire(here, spawn, 0, extraQ);
      }
      gr.cells.forEach(k => {
        if (k === spawn) return;
        seeds.set(k, 0);
        if (spawn !== null) gemAt(k).mergeTo = unkey(spawn);
      });
    }
    extraQ.forEach(([k, d]) => { if (!seeds.has(k)) seeds.set(k, d); });
    const cleared = expand(seeds, protect);
    if (combo > 1) popups.push({ x: SIZE / 2, y: SIZE / 2, text: 'Каскад ×' + combo, t0: now, life: 800, big: true });
    sound.match(combo);
    await animateClear(cleared);
    applyClear(cleared, combo, bonus);
    protect.forEach((p, k) => {
      const g = gemAt(k);
      g.kind = p.kind; g.spent = false; delete g.target;
      g.color = p.kind === 'star' ? -1 : p.color;
      tween(240, t => { g.sc = 1 + .5 * Math.sin(t * Math.PI); }, easeOut);
      sound.spawn();
    });
    await gravity();
    swapKeys = null;
  }
}

function animateClear(cleared) {
  const jobs = [];
  cleared.forEach((delay, k) => {
    const g = gemAt(k);
    const [r, c] = unkey(k);
    const x0 = g.x, y0 = g.y, to = g.mergeTo;
    jobs.push(tween(170, t => {
      if (to) { g.x = x0 + (to[1] - x0) * t; g.y = y0 + (to[0] - y0) * t; }
      else g.sc = 1 + .25 * t;
      g.a = 1 - t;
      if (t > 0 && !g.burst && !to) { g.burst = true; burst(c, r, g.color); }
    }, easeOut, delay));
  });
  return Promise.all(jobs);
}

function applyClear(cleared, combo, bonus) {
  const flown = {};
  let gained = bonus, sx = 0, sy = 0;
  cleared.forEach((_, k) => {
    const g = gemAt(k), [r, c] = unkey(k);
    gained += 10 * combo; sx += c; sy += r;
    if (S.goals[g.color] > 0) {
      S.goals[g.color]--;
      flown[g.color] = (flown[g.color] || 0) + 1;
      if (flown[g.color] <= 5) fly(g.color, c, r);
    }
    grid[r][c] = null;
  });
  S.score += gained;
  const n = Math.max(1, cleared.size);
  popups.push({ x: sx / n, y: sy / n, text: '+' + gained, t0: now, life: 650 });
  renderHud(Object.keys(flown));
}

function gravity() {
  const jobs = [];
  for (let c = 0; c < SIZE; c++) {
    let write = SIZE - 1;
    for (let r = SIZE - 1; r >= 0; r--) {
      const g = grid[r][c];
      if (!g) continue;
      if (r !== write) { grid[write][c] = g; grid[r][c] = null; }
      write--;
    }
    let above = 1;
    for (let r = write; r >= 0; r--) {
      const g = newGem(r, c, rnd(S.cfg.nColors));
      g.y = -above++;
      grid[r][c] = g;
    }
    for (let r = 0; r < SIZE; r++) {
      const g = grid[r][c];
      if (g.y === r) continue;
      const from = g.y, dist = r - from;
      jobs.push(tween(140 + Math.sqrt(dist) * 95, t => { g.y = from + (r - from) * t; }, landing));
    }
  }
  return Promise.all(jobs);
}

async function finishTurn() {
  const done = goalsDone();
  if (done || S.moves <= 0) {
    S.over = true;
    if (done) { S.score += S.moves * 50; renderHud(); }
    if (restartPending) { restartPending = false; start(S.level); return; }
    showResult(done);
    return;
  }
  if (!findMove()) await shuffle();
  idle();
  if (restartPending) { restartPending = false; start(S.level); }
}
function idle() { busy = false; hintAt = now + 5500; waveStart = now + 3000; }
const goalsDone = () => Object.values(S.goals).every(v => v <= 0);

async function shuffle() {
  popups.push({ x: SIZE / 2, y: SIZE / 2, text: 'Нет ходов, мешаем', t0: now, life: 1000, big: true });
  const all = grid.flat();
  do {
    for (let i = all.length - 1; i > 0; i--) { const j = rnd(i + 1); [all[i], all[j]] = [all[j], all[i]]; }
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) grid[r][c] = all[r * SIZE + c];
  } while (findGroups(grid).length || !findMove());
  const jobs = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const g = grid[r][c], x0 = g.x, y0 = g.y;
    jobs.push(tween(420, t => { g.x = x0 + (c - x0) * t; g.y = y0 + (r - y0) * t; }, easeIO));
  }
  await Promise.all(jobs);
}

function fillBoard(nColors) {
  do {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
      grid.push([]);
      for (let c = 0; c < SIZE; c++) {
        let col;
        do col = rnd(nColors);
        while ((c >= 2 && grid[r][c - 1].color === col && grid[r][c - 2].color === col) ||
               (r >= 2 && grid[r - 1][c].color === col && grid[r - 2][c].color === col));
        grid[r].push(newGem(r, c, col));
      }
    }
  } while (!findMove());
}

function start(level) {
  const cfg = levelConfig(level);
  S = { level, cfg, moves: cfg.moves, score: 0, goals: { ...cfg.goals }, over: false };
  tweens.clear(); particles = []; fxList = []; popups = [];
  selected = null; hint = null;
  fillBoard(cfg.nColors);
  $('result').hidden = true;
  $('levelLabel').textContent = 'Уровень ' + level;
  $('tick2').style.left = (cfg.star2 / cfg.star3 * 100) + '%';
  buildGoals();
  renderHud();
  idle();
  try { localStorage.setItem('ogranka.level', level); } catch (e) {}
}

/* ---------- HUD ---------- */
function spriteHtml(row, size, off) {
  const s = size;
  return `<span class="sprite${off ? ' off' : ''}" style="display:block;width:${s}px;height:${s}px;background-size:${FRAMES * s}px ${24 * s}px;background-position:0 ${-row * s}px"></span>`;
}
function buildGoals() {
  $('goals').innerHTML = Object.keys(S.goals).map(c =>
    `<div class="goal" id="goal${c}" aria-label="${COLORS[c].name}">${spriteHtml(COLORS[c].row, 36)}<b></b></div>`).join('');
}
function renderHud(popped = []) {
  $('moves').textContent = S.moves;
  $('moves').classList.toggle('low', S.moves <= 3);
  $('score').textContent = S.score;
  $('fill').style.width = Math.min(100, S.score / S.cfg.star3 * 100) + '%';
  for (const c in S.goals) {
    const el = $('goal' + c);
    el.querySelector('b').textContent = S.goals[c] > 0 ? S.goals[c] : '✓';
    el.classList.toggle('done', S.goals[c] <= 0);
    if (popped.includes(c)) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }
}
function fly(color, c, r) {
  if (SPEED === 0 || reduced) return;
  const target = $('goal' + color);
  if (!target) return;
  const box = canvas.getBoundingClientRect(), to = target.getBoundingClientRect();
  const size = 36;
  const x0 = box.left + (c + .5) * cell - size / 2, y0 = box.top + (r + .5) * cell - size / 2;
  const el = document.createElement('div');
  el.className = 'flyer';
  el.innerHTML = spriteHtml(COLORS[color].row, size);
  document.body.appendChild(el);
  el.animate([
    { transform: `translate(${x0}px,${y0}px) scale(1)` },
    { transform: `translate(${to.left + 5}px,${to.top + 3}px) scale(.8)` },
  ], { duration: 460, easing: 'cubic-bezier(.5,0,.3,1)' }).finished.finally(() => el.remove());
}
function showResult(won) {
  const { cfg, score, level } = S;
  const stars = !won ? 0 : score >= cfg.star3 ? 3 : score >= cfg.star2 ? 2 : 1;
  $('resTitle').textContent = won ? `Уровень ${level} пройден` : 'Ходы закончились';
  $('stars').innerHTML = won ? [1, 2, 3].map(i => spriteHtml(STAR_ROW, 64, i > stars)).join('') : '';
  $('left').innerHTML = won ? '' : Object.keys(S.goals).filter(c => S.goals[c] > 0).map(c =>
    `<div class="goal">${spriteHtml(COLORS[c].row, 36)}<b>${S.goals[c]}</b></div>`).join('');
  $('resText').textContent = won ? `Набрано карат: ${score}` : 'Осталось собрать эти камни.';
  $('resBtn').textContent = won ? 'Следующий уровень' : 'Сыграть ещё раз';
  $('resBtn').onclick = () => start(won ? level + 1 : level);
  $('result').hidden = false;
  won ? sound.win() : sound.bad();
}

/* ---------- Effects ---------- */
function addFx(fx, delay) { fx.t0 = now + delay * SPEED; fx.life = 300; if (SPEED) fxList.push(fx); }
function burst(c, r, color) {
  if (reduced || SPEED === 0 || particles.length > 220) return;
  const hex = color >= 0 ? COLORS[color].hex : '#f5e8d3';
  for (let i = 0; i < 7; i++) {
    const a = Math.random() * 6.283, v = 2 + Math.random() * 4;
    particles.push({ x: c + .5, y: r + .5, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, hex, s: .05 + Math.random() * .07 });
  }
}

/* ---------- Render ---------- */
function frameOf(g) {
  if (g === selected) return Math.floor(now / 30) % FRAMES;
  if (hint && (g === hint[0] || g === hint[1])) return (Math.round(9 * Math.sin(now / 170)) + FRAMES) % FRAMES;
  if (g.kind !== 'gem' && !reduced) return (Math.round(5 * Math.sin(now / 380 + g.id)) + FRAMES) % FRAMES;
  if (!busy && !reduced) {
    const d = (now - waveStart - (g.x + g.y) * 60) / 560;
    if (d > 0 && d < 1) return Math.floor(d * FRAMES) % FRAMES;
  }
  return 0;
}
function rowOf(g) { return g.kind === 'star' ? STAR_ROW : COLORS[g.color].row + KIND_OFFSET[g.kind]; }

function drawGem(g) {
  let sc = g.sc;
  if (hint && (g === hint[0] || g === hint[1])) sc *= 1 + .07 * Math.sin(now / 130);
  const size = cell * 1.12 * sc, px = (g.x + .5) * cell, py = (g.y + .5) * cell;
  ctx.globalAlpha = g.a;
  if (sheet.complete && sheet.naturalWidth) {
    ctx.drawImage(sheet, frameOf(g) * TILE, rowOf(g) * TILE, TILE, TILE, px - size / 2, py - size / 2, size, size);
  } else {
    ctx.fillStyle = g.color >= 0 ? COLORS[g.color].hex : '#fff';
    ctx.beginPath(); ctx.arc(px, py, size * .32, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function render(dt) {
  const w = canvas.width;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, w);
  ctx.save();
  if (shake > .3) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= .86; }
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#2c1921' : '#35202a';
    ctx.fillRect(c * cell, r * cell, cell + .5, cell + .5);
  }
  if (selected) {
    ctx.strokeStyle = '#d9ae62'; ctx.lineWidth = 2;
    ctx.strokeRect(selected.x * cell + 2, selected.y * cell + 2, cell - 4, cell - 4);
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, SIZE * cell, SIZE * cell); ctx.clip();
  for (const row of grid) for (const g of row) if (g) drawGem(g);
  ctx.restore();
  drawFx();
  drawParticles(dt);
  drawPopups();
  ctx.restore();
}

function drawFx() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  fxList = fxList.filter(f => now < f.t0 + f.life);
  for (const f of fxList) {
    const t = (now - f.t0) / f.life;
    if (t < 0) continue;
    const a = 1 - t, full = SIZE * cell;
    if (f.type === 'beam') {
      const half = f.width === 3 ? 1.5 : .5, th = cell * half * 2 * (1 - t * .7);
      ctx.fillStyle = `rgba(255,226,160,${.75 * a})`;
      ctx.fillRect(0, (f.r + .5) * cell - th / 2, full, th);
      ctx.fillRect((f.c + .5) * cell - th / 2, 0, th, full);
    } else if (f.type === 'ring') {
      ctx.strokeStyle = `rgba(255,214,150,${a})`;
      ctx.lineWidth = cell * .4 * a + 1;
      ctx.beginPath(); ctx.arc((f.c + .5) * cell, (f.r + .5) * cell, f.radius * cell * easeOut(t), 0, 6.283); ctx.stroke();
    } else {
      ctx.strokeStyle = `rgba(255,240,210,${a})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (const k of f.targets) {
        const [r, c] = unkey(k);
        ctx.moveTo((f.c + .5) * cell, (f.r + .5) * cell);
        ctx.lineTo((c + .5) * cell, (r + .5) * cell);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawParticles(dt) {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 9 * dt; p.life -= dt * 2.1;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.hex;
    const s = p.s * cell;
    ctx.fillRect(p.x * cell - s / 2, p.y * cell - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}
function drawPopups() {
  popups = popups.filter(p => now < p.t0 + p.life);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    const t = (now - p.t0) / p.life;
    const size = p.big ? cell * .62 : cell * .42;
    ctx.font = `700 ${size}px Unbounded, "Arial Black", sans-serif`;
    ctx.globalAlpha = t < .7 ? 1 : (1 - t) / .3;
    const x = p.x * cell, y = (p.y + (p.big ? .5 : .5)) * cell - t * cell * (p.big ? .3 : .8);
    ctx.lineWidth = size * .22; ctx.strokeStyle = '#190c10'; ctx.lineJoin = 'round';
    ctx.strokeText(p.text, x, y);
    ctx.fillStyle = p.big ? '#d9ae62' : '#f5e8d3';
    ctx.fillText(p.text, x, y);
  }
  ctx.globalAlpha = 1;
}

let last = now;
function loop(ts) {
  now = ts;
  const dt = Math.min(.05, (ts - last) / 1000); last = ts;
  tweens.forEach(tw => {
    if (now < tw.t0) return;
    const t = Math.min(1, (now - tw.t0) / tw.ms);
    tw.fn(tw.ease(t));
    if (t >= 1) { tweens.delete(tw); tw.res(); }
  });
  if (!busy && !S.over) {
    if (now > hintAt && !hint) {
      const m = findMove();
      if (m) hint = [grid[m[0].r][m[0].c], grid[m[1].r][m[1].c]];
    }
    if (now > waveStart + 9000) waveStart = now;
  }
  render(dt);
  requestAnimationFrame(loop);
}

function resize() {
  const box = $('stage').getBoundingClientRect();
  // leave room for the tray's 6px outline so it stays inside the gutter
  const css = Math.floor(Math.min(box.width, box.height) - 12);
  if (css <= 0) return;
  dpr = Math.min(3, window.devicePixelRatio || 1);
  cell = css / SIZE;
  canvas.style.width = canvas.style.height = css + 'px';
  canvas.width = canvas.height = Math.round(css * dpr);
}

/* ---------- Input ---------- */
let press = null;
function cellFromEvent(e) {
  const b = canvas.getBoundingClientRect();
  return { c: Math.floor((e.clientX - b.left) / cell), r: Math.floor((e.clientY - b.top) / cell) };
}
canvas.addEventListener('pointerdown', e => {
  sound.unlock();
  e.preventDefault();
  if (busy || S.over) return;
  const p = cellFromEvent(e);
  if (!inBoard(p.r, p.c)) return;
  canvas.setPointerCapture(e.pointerId);
  press = { ...p, x: e.clientX, y: e.clientY };
  hint = null; hintAt = now + 5500;
});
canvas.addEventListener('pointermove', e => {
  if (!press) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < cell * .3) return;
  const horizontal = Math.abs(dx) > Math.abs(dy);
  const to = { r: press.r + (horizontal ? 0 : Math.sign(dy)), c: press.c + (horizontal ? Math.sign(dx) : 0) };
  const from = { r: press.r, c: press.c };
  press = null;
  if (inBoard(to.r, to.c)) playTurn(from, to);
});
canvas.addEventListener('pointerup', () => {
  if (!press) return;
  const p = { r: press.r, c: press.c };
  press = null;
  const sel = selected;
  if (sel) {
    selected = null;
    if (Math.abs(sel.y - p.r) + Math.abs(sel.x - p.c) === 1) { playTurn({ r: sel.y, c: sel.x }, p); return; }
    if (sel === grid[p.r][p.c]) return;
  }
  selected = grid[p.r][p.c];
  sound.tick();
});
canvas.addEventListener('pointercancel', () => { press = null; });

$('btnRestart').addEventListener('click', () => {
  sound.unlock();
  if (busy) restartPending = true; else start(S.level);
});
$('btnSound').addEventListener('click', () => {
  sound.unlock();
  sound.on = !sound.on;
  $('btnSound').setAttribute('aria-pressed', sound.on);
  try { localStorage.setItem('ogranka.sound', sound.on ? '1' : '0'); } catch (e) {}
});

/* ---------- Sound (synthesized) ---------- */
const sound = {
  ac: null, on: true,
  unlock() {
    if (!this.ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ac = new AC(); }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  tone(f, dur, type = 'sine', vol = .12, when = 0) {
    if (!this.on || !this.ac || SPEED === 0) return;
    const t = this.ac.currentTime + when, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(this.ac.destination);
    o.start(t); o.stop(t + dur);
  },
  tick() { this.tone(1200, .04, 'triangle', .06); },
  swap() { this.tone(420, .07, 'triangle', .08); },
  bad() { this.tone(170, .16, 'sawtooth', .06); },
  match(combo) {
    const f = NOTES[Math.min(combo - 1, NOTES.length - 1)];
    this.tone(f, .22); this.tone(f * 1.5, .22, 'sine', .07, .05);
    this.buzz(12);
  },
  buzz(ms) {
    if (!this.ac || SPEED === 0) return; // ac exists only after the first tap
    try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {}
  },
  spawn() { this.tone(988, .12, 'triangle', .09); this.tone(1319, .2, 'triangle', .09, .08); },
  boom() {
    if (!this.on || !this.ac || SPEED === 0) return;
    const len = Math.floor(this.ac.sampleRate * .28), buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
    const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 700; g.gain.value = .3;
    s.connect(f).connect(g).connect(this.ac.destination);
    s.start();
    this.buzz(30);
  },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .3, 'triangle', .1, i * .11)); },
};

/* ---------- Boot ---------- */
$('legend').innerHTML = [
  [COLORS[0].row + 2, '4 в ряд: дуга бьёт крестом'],
  [COLORS[1].row + 1, 'Уголок: сердце-бомба'],
  [STAR_ROW, '5 в ряд: звезда цвета'],
].map(([row, text]) => `<div class="leg">${spriteHtml(row, 32)}<span>${text}</span></div>`).join('');

let savedLevel = 1;
try {
  savedLevel = Math.max(1, parseInt(localStorage.getItem('ogranka.level'), 10) || 1);
  sound.on = localStorage.getItem('ogranka.sound') !== '0';
  $('btnSound').setAttribute('aria-pressed', sound.on);
} catch (e) {}
new ResizeObserver(resize).observe($('stage'));
resize();
start(savedLevel);
requestAnimationFrame(loop);

// Test hook for balance checks.
window.__ogranka = {
  get S() { return S; }, get grid() { return grid; }, get busy() { return busy; },
  findGroups, findMove, playTurn, start, levelConfig, swapGrid, isCombo,
  setSpeed(v) { SPEED = v; },
};
</script>
